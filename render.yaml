# Blueprint do Render — Worker Hub do SAVORA.
#
#   render.com -> New -> Blueprint -> joaoviola/SAVORA
#
# Runtime Python nativo, SEM Docker. O Render instala e arranca
# directamente a partir de scraper/. Elimina a construcao de imagem,
# que era onde os deploys falhavam -- e o Dockerfile da raiz (front-end)
# deixou de poder ser apanhado por engano, porque saiu da raiz.
services:
  - type: web
    name: savora-scraper
    runtime: python
    rootDir: scraper
    plan: free
    region: frankfurt
    healthCheckPath: /healthz
    autoDeploy: true
    buildCommand: pip install --no-cache-dir -r requirements.txt
    startCommand: uvicorn api:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      # Gerados pelo Render; copiam-se do painel com um botao.
      - key: SCRAPER_API_KEY
        generateValue: true
      - key: IG_SEGREDO
        generateValue: true
